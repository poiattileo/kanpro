    <ellipse cx="1350" cy="750" rx="300" ry="200" fill="#b388ff" opacity=".7" transform="rotate(20 1350 750)"/>
    <ellipse cx="480" cy="800" rx="260" ry="180" fill="#1e5fb8" opacity=".85" transform="rotate(-24 480 800)"/>
  </g>
  <ellipse cx="960" cy="1050" rx="900" ry="140" fill="#04102a" opacity=".45"/>
</svg>
