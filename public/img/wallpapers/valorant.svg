  <polygon points="1500,1080 1920,520 1920,700 1680,1080" fill="#ff4655"/>
  <circle cx="960" cy="540" r="90" fill="none" stroke="#ece8e1" stroke-width="10" opacity=".9"/>
  <circle cx="960" cy="540" r="10" fill="#ff4655"/>
